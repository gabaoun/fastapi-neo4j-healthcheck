[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fastapi-neo4j-healthcheck"
version = "0.1.0"
description = "Production-grade, zero-overhead Neo4j health check endpoint for FastAPI applications with Kubernetes liveness/readiness probe support."
readme = "README.md"
authors = [
    { name = "Gabaoun", email = "94999154+gabaoun@users.noreply.github.com" }
]
license = "MIT"
keywords = ["fastapi", "neo4j", "healthcheck", "kubernetes", "liveness", "readiness", "monitoring", "cypher"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: FastAPI",
    "Topic :: System :: Monitoring",
]
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.100.0",
]

[project.optional-dependencies]
neo4j = ["neo4j>=5.0.0"]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "neo4j>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/gabaoun/fastapi-neo4j-healthcheck"
Repository = "https://github.com/gabaoun/fastapi-neo4j-healthcheck"
Issues = "https://github.com/gabaoun/fastapi-neo4j-healthcheck/issues"

[tool.hatch.build.targets.wheel]
packages = ["fastapi_neo4j_healthcheck"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
